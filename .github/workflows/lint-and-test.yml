name: Lint, Test

# Run on every push and PR
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: # manual runs

permissions:
  contents: read

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

      - name: Unit tests
        run: make test
  component-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spec tests
        run: make comptest
