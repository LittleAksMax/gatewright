services:
  test:
    build:
      context: .
      target: spec-tests
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    environment:
      # avoid running component test on dev machine
      GATEWRIGHT_COMP_TESTS: "docker"
    volumes:
      - ./comp_results:/results
    command: pytest -q -p no:cacheprovider --junitxml=/results/report.xml /comp_tests
